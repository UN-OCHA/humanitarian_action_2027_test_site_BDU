<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<title>HA 2027 test site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
<style>
/* Layout concept: the Humanitarian Action theme on OCHA Common Design tokens. 1400px container,
   12 / 8 / 4 columns, coloured bands run to the container edges and their text sits on the grid.
   Single light theme on purpose: this reproduces the live site, which has no dark mode. */
:root {
  color-scheme: light;
  /* Colour tokens (HA theme on current CD names) */
  --brand-primary: #FFC800;
  --brand-primary--dark: #CF9220;
  --brand-primary--light: #FAF0BB;
  --brand-primary--on: #262626;
  --cd-default-text-color: #4D4D4D;
  --cd-grey--mid: #737373;
  --brand-grey: #F2F2F2;
  --brand-grey--border: #E6E6E6;
  --cd-red: #ED1847;
  --cd-white: #FFFFFF;
  --cd-grey--900: #262626;
  /* Spacing */
  /* Sizes in rem, as OCHA Common Design writes them (1rem = 16px); px in the comments */
  --cd-space--3xs: 0.25rem; --cd-space--2xs: 0.5rem; --cd-space--xs: 0.75rem; --cd-space--sm: 1rem;   /* 4 8 12 16 */
  --cd-space--md: 1.5rem; --cd-space--lg: 2rem; --cd-space--xl: 3rem; --cd-space--2xl: 4rem;          /* 24 32 48 64 */
  /* Type */
  --font: "Roboto", "Helvetica Neue", Arial, sans-serif;
  --cd-font-size--small: 0.875rem; --cd-font-size--ref: 1rem; --cd-font-size--base: 1.125rem;  /* 14 16 18 */
  --type-h1: 1.875rem; --type-h2: 1.625rem; --type-h3: 1.375rem; --type-key-figure: 1.625rem;   /* phone: 30 26 22 26 */
  /* Layout */
  --gutter: 0.75rem; --col-gap: var(--cd-space--sm); --section-gap: var(--cd-space--lg); --max: 1400px;
}
/* Breakpoints stay in px (screen widths), as in OCHA CD: 768px --cd-bp--md, 1024px --cd-bp--lg */
@media (min-width: 768px) { :root { --gutter: 1.5rem; --col-gap: var(--cd-space--md); --section-gap: var(--cd-space--xl); --type-key-figure: 1.875rem; } }
@media (min-width: 1024px) { :root { --gutter: 2.5rem; --type-h1: 2.375rem; --type-h2: 1.875rem; --type-h3: 1.625rem; --type-key-figure: 2.375rem; } }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; } /* load-bearing: .acc__body and .columns-panel set display, which would override the hidden attribute */
html { background: var(--cd-white); }
body { margin: 0; background: var(--cd-white); color: var(--cd-default-text-color); font-family: var(--font); font-size: var(--cd-font-size--ref); line-height: 1.5; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; }
.h1 { font-size: var(--type-h1); line-height: 1.2; }
.h2 { font-size: var(--type-h2); line-height: 1.25; }
.h3 { font-size: var(--type-h3); line-height: 1.3; }
.small { font-size: var(--cd-font-size--small); line-height: 1.4; }
:focus-visible { outline: 3px solid var(--cd-grey--900); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Prototype chrome (not part of the design) */
.proto-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--cd-grey--900); color: var(--cd-white); font-size: var(--cd-font-size--small); }
.proto-bar__inner { max-width: var(--max); margin: 0 auto; padding: 8px var(--gutter); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; }
.proto-bar nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.proto-bar a { color: var(--cd-white); text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
.proto-bar a[aria-current="page"] { border-bottom-color: var(--brand-primary); font-weight: 700; }
.proto-bar__label { opacity: .8; }
.seg { display: inline-flex; border: 1px solid #8a8a8a; border-radius: 3px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; background: transparent; color: var(--cd-white); border: 0; padding: 4px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand-primary); color: var(--brand-primary--on); font-weight: 700; }

/* Container and grid */
.container { width: 100%; max-width: var(--max); margin: 0 auto; padding-inline: var(--gutter); }
.band { width: 100%; max-width: var(--max); margin: 0 auto; }
.band__inner { padding-inline: var(--gutter); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--col-gap); }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(12, minmax(0, 1fr)); } }
main { display: flex; flex-direction: column; gap: var(--section-gap); padding-bottom: var(--cd-space--2xl); }
.section { display: flex; flex-direction: column; gap: var(--cd-space--sm); }
.placeholder { background: repeating-linear-gradient(135deg, var(--brand-grey) 0 12px, #ececec 12px 24px); color: var(--cd-grey--mid); font-size: var(--cd-font-size--small); display: grid; place-items: center; text-align: center; padding: var(--cd-space--md); border: 1px dashed #cfcfcf; }

/* Buttons: one 44px box for every variant (OCHA CD standard) */
.cd-button { display: inline-flex; align-items: center; justify-content: center; gap: var(--cd-space--2xs); padding: var(--cd-space--xs) var(--cd-space--md); border: 2px solid transparent; border-radius: 3px; background: var(--brand-primary); color: var(--brand-primary--on); font: 700 var(--cd-font-size--small)/1.15 var(--font); text-transform: uppercase; text-decoration: none; cursor: pointer; white-space: nowrap; }
.cd-button:hover { background: var(--brand-primary--dark); }
.cd-button--outline { background: var(--cd-white); color: var(--cd-default-text-color); border-color: var(--cd-default-text-color); }
.cd-button--outline:hover { background: var(--brand-grey); }
.cd-button svg { width: 16px; height: 16px; flex: none; }

/* Homepage hero: Simple */
.hero-s__photo { aspect-ratio: 5 / 2; width: 100%; object-fit: cover; }
.hero-s__panel { background: var(--brand-primary--light); padding-block: var(--cd-space--lg); }
.hero-s__title { grid-column: 1 / -1; }
.hero-s__body { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: flex-start; gap: var(--cd-space--md); }
@media (min-width: 768px) { .hero-s__title { grid-column: span 4; } .hero-s__body { grid-column: span 4; } }
@media (min-width: 1024px) { .hero-s__title { grid-column: span 6; } .hero-s__body { grid-column: span 6; } }
.hero__desc { margin: 0; }
/* Homepage hero: Advanced */
.hero-a { background: var(--brand-primary--light); padding-block: var(--cd-space--xl); }
.hero-a__copy { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: flex-start; gap: var(--cd-space--md); align-self: center; }
.hero-a__accent { width: 40px; height: 4px; background: var(--brand-primary); }
.hero-a__copy .hero__desc { font-size: var(--cd-font-size--base); line-height: 1.65; }
.hero-a__photo { grid-column: 1 / -1; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; align-self: center; }
@media (min-width: 768px) { .hero-a__copy { grid-column: span 4; } .hero-a__photo { grid-column: span 4; } }
@media (min-width: 1024px) { .hero-a__copy { grid-column: span 5; } .hero-a__photo { grid-column: span 7; } }
/* Latest updates + Donate */
.below { row-gap: var(--section-gap); }
.updates { grid-column: 1 / -1; }
.donate { grid-column: 1 / -1; background: var(--brand-grey); padding: var(--cd-space--md); display: flex; flex-direction: column; align-items: flex-start; gap: var(--cd-space--sm); align-self: start; }
.donate p { margin: 0; }
@media (min-width: 1024px) { .updates { grid-column: span 8; } .donate { grid-column: span 4; } }
.updates__list { display: grid; grid-template-columns: 1fr; gap: var(--cd-space--md); list-style: none; margin: 0; padding: 0; }
@media (min-width: 768px) { .updates__list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.update { display: flex; gap: var(--cd-space--sm); align-items: flex-start; }
.update img { width: 140px; height: 85px; object-fit: cover; flex: none; }
.update__date { font-size: var(--cd-font-size--small); line-height: 1.4; margin: 0 0 4px; }
.update__title { font-weight: 700; line-height: 1.5; text-decoration: none; }
.update__title:hover { text-decoration: underline; }

/* Plan page header (placeholder) */
.plan-head { display: flex; flex-direction: column; gap: var(--cd-space--sm); padding-top: var(--cd-space--lg); }
.example-note { font-size: var(--cd-font-size--small); color: var(--cd-grey--mid); margin: 0; }

/* Key figures */
.kf-band { background: var(--brand-grey); padding-block: var(--cd-space--lg); }
.kf-groups { row-gap: var(--cd-space--xl); }
.kf-group { grid-column: 1 / -1; display: flex; flex-direction: column; gap: var(--cd-space--md); }
@media (min-width: 768px) { .kf-group { grid-column: span 4; } }
/* 1024–1199px: 2 × 2 groups, as on tablet (4 side by side would make the figures wrap); 4 across from 1200px (--cd-bp--xl) */
@media (min-width: 1024px) { .kf-group { grid-column: span 6; } }
@media (min-width: 1200px) { .kf-group { grid-column: span 3; } }
.kf-group__head { display: flex; align-items: center; gap: var(--cd-space--sm); padding-bottom: var(--cd-space--xs); border-bottom: 2px solid var(--cd-default-text-color); font-size: var(--cd-font-size--small); font-weight: 700; text-transform: uppercase; min-height: 34px; }
.kf-group__head svg { width: 32px; height: 32px; }
.kf-list { display: flex; flex-direction: column; gap: var(--cd-space--md); margin: 0; }
.kf-list--2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--cd-space--md); }
.kf dt { font-size: var(--cd-font-size--ref); }
.kf dd { margin: 0; display: flex; flex-direction: column; gap: var(--cd-space--2xs); }
.kf__value { display: inline-flex; align-items: center; gap: var(--cd-space--2xs); font-size: var(--type-key-figure); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kf__value--prioritized { color: var(--cd-red); }
.kf-list--2x2 .kf__value { font-size: var(--type-h3); }
.info { display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; background: none; color: var(--cd-grey--mid); cursor: help; }
.info svg { width: 16px; height: 16px; }
.kf-source { font-size: var(--cd-font-size--small); line-height: 1.4; margin: 0; }
.kf-band .kf-source--all { margin-top: var(--cd-space--lg); }

/* Bars (charts rule): 12px, square ends */
.bar { position: relative; height: 12px; background: var(--brand-primary--light); }
.bar__part { position: absolute; inset: 0 auto 0 0; background: var(--brand-primary); }
.bar-row { display: flex; align-items: center; gap: var(--cd-space--2xs); }
.bar-row .bar { flex: 1; }
.bar-row b { font-size: var(--cd-font-size--small); }

/* Tooltip (Tippy look, box --cd-grey--900) */
.tip { position: fixed; z-index: 60; background: var(--cd-grey--900); color: var(--cd-white); font-size: var(--cd-font-size--small); line-height: 1.4; padding: var(--cd-space--xs) var(--cd-space--sm); border-radius: 4px; max-width: 280px; pointer-events: none; opacity: 0; transition: opacity .15s; }
.tip[data-show] { opacity: 1; }
.tip::after { content: ""; position: absolute; left: var(--arrow-x, 50%); top: 100%; transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--cd-grey--900); border-bottom: 0; }
.tip b { display: block; }

/* Cluster overview table */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--cd-space--sm) var(--cd-space--md); align-items: center; justify-content: space-between; }
.toolbar__group { display: flex; flex-wrap: wrap; gap: var(--cd-space--2xs) var(--cd-space--sm); align-items: center; }
.toolbar label { display: inline-flex; gap: var(--cd-space--2xs); align-items: center; font-size: var(--cd-font-size--small); cursor: pointer; min-height: 44px; }
.toolbar input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--cd-default-text-color); margin: 0; }
.view-switch { display: none; }
@media (min-width: 1024px) { .view-switch { display: flex; } }
.columns-wrap { position: relative; }
.columns-panel { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; background: var(--cd-white); border: 1px solid var(--brand-grey--border); padding: var(--cd-space--sm); display: flex; flex-direction: column; gap: 0; width: max-content; min-width: 240px; max-width: calc(100vw - 2 * var(--gutter)); }
.columns-panel label { min-height: 36px; }
.columns-panel__title { font-size: var(--cd-font-size--small); font-weight: 700; text-transform: uppercase; margin: 0 0 var(--cd-space--2xs); }
.columns-panel__group { font-size: var(--cd-font-size--small); font-weight: 700; margin: var(--cd-space--2xs) 0 0; }
.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: var(--cd-font-size--ref); }
.tbl th { text-align: left; font-size: var(--cd-font-size--small); font-weight: 700; text-transform: uppercase; line-height: 1.4; padding: 0 var(--cd-space--md) var(--cd-space--xs) 0; vertical-align: bottom; }
.tbl thead tr:last-child th { border-bottom: 2px solid var(--cd-default-text-color); }
.tbl td { padding: var(--cd-space--xs) var(--cd-space--md) var(--cd-space--xs) 0; border-bottom: 1px solid var(--brand-grey--border); vertical-align: middle; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl tr.is-hl td { background: var(--brand-grey); }
.tbl .grp th { padding-bottom: 0; line-height: 1.2; }
.tbl .grp th[colspan] span { display: block; } /* no rule under the group word: it reads as one label with the header below (“People in need”) */
.cl { display: flex; align-items: center; gap: var(--cd-space--xs); }
.cl svg { width: 24px; height: 24px; flex: none; }
.num { font-variant-numeric: tabular-nums; font-size: var(--cd-font-size--small); }
.num b { font-weight: 700; }
.cellbar { display: flex; flex-direction: column; gap: var(--cd-space--3xs); }
.cellbar__top { font-size: var(--cd-font-size--small); font-weight: 700; line-height: 1.4; }
.cellbar__line { display: flex; align-items: center; gap: var(--cd-space--xs); }
.cellbar__line { --label-room: 5.5em; }
.cellbar__line > .barbtn, .cellbar__line > .barwrap { flex: none; }
.cellbar__total { font-size: var(--cd-font-size--small); line-height: 1.4; white-space: nowrap; }
.barbtn { display: block; padding: 6px 0; margin: -6px 0; border: 0; background: none; cursor: pointer; }
.is-hidden-values .cellbar__top, .is-hidden-values .cellbar__total { display: none; }
.table-scroll { overflow-x: auto; }
.c-all-cl { width: 24%; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--cd-space--sm); margin-top: var(--cd-space--2xs); }
.fig { display: flex; flex-direction: column; gap: var(--cd-space--3xs); }
.fig__label { font-size: var(--cd-font-size--small); line-height: 1.4; }
.fig__value { display: flex; flex-direction: column; gap: var(--cd-space--3xs); }
/* Tablet: the same All columns table, tighter; % funded as a number; Cluster column stays put if the figures scroll */
@media (min-width: 768px) and (max-width: 1023.98px) {
  .tbl--all { table-layout: auto; }
  .c-all-cl { width: 150px; }
  .tbl--all th, .tbl--all td { padding-right: var(--cd-space--sm); }
  .tbl--all .bar-row .bar { display: none; }
  .tbl--all th:first-child, .tbl--all td:first-child { position: sticky; left: 0; background: var(--cd-white); z-index: 1; }
}
/* Merged table columns follow the Figma grid: tablet 2 | 3 | 2 | 1 of 8, desktop 3 | 4 | 4 | 1 of 12 */
.c-cl { width: 22.5%; } .c-p { width: 35.5%; } .c-f { width: 26%; } .c-r { width: 16%; }
@media (min-width: 1024px) { .c-cl { width: 24%; } .c-p { width: 33.5%; } .c-f { width: 33.5%; } .c-r { width: 9%; } }

/* Phone: accordion rows (both versions) */
.acc { display: none; list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--cd-default-text-color); }
.acc__item { border-bottom: 1px solid var(--brand-grey--border); }
.acc__btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--cd-space--xs); padding: var(--cd-space--sm) 0; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; min-height: 56px; }
.acc__btn svg.chev { width: 16px; height: 16px; flex: none; }
.acc__item.is-open { background: var(--brand-grey); }
.acc__item.is-open .acc__btn { padding-inline: var(--cd-space--xs); }
.acc__body { padding: 0 var(--cd-space--xs) var(--cd-space--sm); display: flex; flex-direction: column; gap: var(--cd-space--xs); }
.acc__label { font-size: var(--cd-font-size--small); font-weight: 700; text-transform: uppercase; }
@media (max-width: 767.98px) { .tbl-wrap { display: none; } .acc { display: block; } }

/* Documents and links */
.docs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 0 var(--col-gap); }
@media (min-width: 768px) { .docs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .docs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.doc { border-top: 1px solid var(--brand-grey--border); padding-block: var(--cd-space--sm) var(--cd-space--md); display: flex; gap: var(--cd-space--sm); align-items: flex-start; }
.doc img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; flex: none; border: 1px solid var(--brand-grey--border); }
.doc__ph { width: 112px; aspect-ratio: 16 / 9; flex: none; background: var(--brand-grey); display: grid; place-items: center; color: var(--cd-default-text-color); }
.doc__ph svg { width: 24px; height: 24px; }
.docs-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--cd-space--xs) var(--cd-space--md); }
.docs-toggle { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cd-space--2xs) var(--cd-space--xs); font-size: var(--cd-font-size--small); }
.seg--light { border-color: var(--brand-grey--border); }
.seg--light button { color: var(--cd-default-text-color); font-size: var(--cd-font-size--small); padding: 6px 12px; }
.doc__title { font-weight: 700; text-decoration: none; display: block; margin-bottom: var(--cd-space--3xs); }
.doc__title:hover { text-decoration: underline; }
.doc__details { font-size: var(--cd-font-size--small); line-height: 1.4; margin: 0; }
.doc__details--short { display: none; }
@media (max-width: 767.98px) { .is-adv .doc__details--full { display: none; } .is-adv .doc__details--short { display: block; } }

/* Design notes (prototype chrome, mirrors the Figma page headers) */
.note { border: 1px dashed #8a8a8a; background: var(--cd-white); padding: var(--cd-space--sm); display: flex; flex-direction: column; gap: var(--cd-space--2xs); font-size: var(--cd-font-size--small); line-height: 1.4; }
.note__kicker { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.note__kicker a { text-transform: none; letter-spacing: 0; }
.note p, .note ul { margin: 0; }
.note ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.note__compare a + a::before { content: " · "; display: inline-block; white-space: pre; text-decoration: none; }
.notes__list { display: grid; grid-template-columns: 1fr; gap: var(--cd-space--md); }
@media (min-width: 1024px) { .notes__list { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); } }
.notes { border-top: 2px solid var(--cd-default-text-color); padding-top: var(--cd-space--md); }
.foot { border-top: 1px solid var(--brand-grey--border); padding-block: var(--cd-space--md); font-size: var(--cd-font-size--small); color: var(--cd-grey--mid); }
</style>

<div class="proto-bar" role="region" aria-label="Prototype controls">
  <div class="proto-bar__inner">
    <nav aria-label="Prototype pages">
      <a href="#home" data-route="home">Homepage</a>
      <a href="#overview" data-route="overview">Plan overview</a>
      <a href="#progress" data-route="progress">Plan progress</a>
    </nav>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="proto-bar__label">Version</span>
      <div class="seg" role="group" aria-label="Design version">
        <button type="button" id="v-simple" data-version="simple" aria-pressed="true">Simple</button>
        <button type="button" id="v-advanced" data-version="advanced" aria-pressed="false">Advanced</button>
      </div>
    </div>
  </div>
</div>

<main id="app" tabindex="-1"></main>
<footer class="container foot">Test version of the humanitarianaction.info designs for 2027. Not the live site. Example content from the live and demo sites.</footer>

const k = n => { // rounding rule: k and M
  if (n == null) return '–'; if (n === 'nd') return 'No data';
  if (n >= 1e6) return (Math.round(n / 1e5) / 10).toString().replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'k';
  return String(n);
};

// Bar length = share of the column maximum, measured on the line minus room for the end label,
// so the longest bar never pushes its label into the next column (load-bearing: --label-room).
const barW = f => `calc((100% - var(--label-room)) * ${Math.max(0.01, f).toFixed(4)})`;
function barCell({ top, total, frac, part, tip, aria, i, plain }) {
  const inner = `<div class="bar" style="width:100%"><div class="bar__part" style="width:${part}%"></div></div>`;
  const el = isAdv() && !plain
    ? `<button type="button" class="barbtn" style="width:${barW(frac)}" data-row="${i}" data-tip="${esc(tip)}" aria-label="${esc(aria)}">${inner}</button>`
    : `<div class="barwrap" style="width:${barW(frac)}">${inner}</div>`;
  return `<div class="cellbar"><span class="cellbar__top">${top}</span><div class="cellbar__line">${el}<span class="cellbar__total">${total}</span></div></div>`;
}
function cellPeople(r, i, plain) {
  const [name,, pin, tgt] = r;
  if (pin == null) return '–';
  return barCell({ top: k(tgt), total: k(pin), frac: pin / MAX_P, part: Math.round(tgt / pin * 100),
    tip: `<b>${esc(name)}</b><b>Targeted: ${k(tgt)}</b>People in need: ${k(pin)}`, aria: `${name}: targeted ${k(tgt)} of ${k(pin)} people in need`, i, plain });
}
function cellFunding(r, i, plain) {
  const [name,,,,, req, rec, pct] = r;
  if (req == null) return '–';
  return barCell({ top: `${usd(rec)} · ${pct}%`, total: usd(req), frac: req / MAX_F, part: pct,
    tip: `<b>${esc(name)}</b><b>Received: ${usd(rec)} · ${pct}%</b>Requirements: ${usd(req)}`, aria: `${name}: received ${usd(rec)}, ${pct}% of ${usd(req)}`, i, plain });
}

  document.querySelectorAll('[data-route]').forEach(a => { if (a.dataset.route === route()) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.querySelectorAll('[data-version]').forEach(b => b.setAttribute('aria-pressed', b.dataset.version === S.version));

let tipFor = null;
function showTip(el) {

  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  const target = el.classList.contains('barbtn') ? (() => { const p = el.querySelector('.bar__part').getBoundingClientRect(); return p.left + p.width / 2; })() : r.left + r.width / 2;
  let left = Math.min(Math.max(8, target - t.width / 2), window.innerWidth - t.width - 8);
  tipEl.style.left = left + 'px'; tipEl.style.top = (r.top - t.height - 10) + 'px';
  tipEl.style.setProperty('--arrow-x', (target - left) + 'px');
  const row = el.dataset.row != null ? el.closest('tr') : null; document.querySelectorAll('tr.is-hl').forEach(x => x.classList.remove('is-hl')); if (row) row.classList.add('is-hl');
}
function hideTip() { tipEl.removeAttribute('data-show'); tipFor = null; document.querySelectorAll('tr.is-hl').forEach(x => x.classList.remove('is-hl')); }
app.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el && el !== tipFor) showTip(el); });
app.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
app.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
app.addEventListener('focusout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
window.addEventListener('scroll', () => tipFor && hideTip(), { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTip(); if (S.colsOpen) { S.colsOpen = false; render(true); } } });
app.addEventListener('click', e => {
  const tipEl2 = e.target.closest('[data-tip]');
  if (tipEl2 && e.pointerType !== 'mouse') { tipFor === tipEl2 ? hideTip() : showTip(tipEl2); return; }
  const v = e.target.closest('[data-view]'); if (v) { S.view = v.dataset.view; S.colsOpen = false; render(true); return; }
  const a = e.target.closest('[data-acc]'); if (a) { const i = +a.dataset.acc; S.open.has(i) ? S.open.delete(i) : S.open.add(i); render(true); document.querySelector(`[data-acc="${i}"]`)?.focus(); return; }
  const ni = e.target.closest('[data-noimg]'); if (ni) { S.noImg = ni.dataset.noimg; store.set('ha-noimg', S.noImg); render(true); document.querySelector(`[data-noimg="${S.noImg}"]`)?.focus(); return; }
  if (e.target.closest('#cols-btn')) { S.colsOpen = !S.colsOpen; render(true); document.getElementById('cols-btn')?.focus(); return; }
});
document.addEventListener('click', e => { if (S.colsOpen && !e.target.closest('.columns-wrap')) { S.colsOpen = false; render(true); } });
app.addEventListener('change', e => {
  if (e.target.id === 'show-values') { S.showValues = e.target.checked; render(true); document.getElementById('show-values')?.focus(); }
  if (e.target.dataset.col) { const c = { ...S.cols, [e.target.dataset.col]: e.target.checked }; if (Object.values(c).some(Boolean)) S.cols = c; render(true); document.getElementById('col-' + e.target.dataset.col)?.focus(); }
  if (e.target.dataset.mcol) { const c = { ...S.mcols, [e.target.dataset.mcol]: e.target.checked }; if (Object.values(c).some(Boolean)) S.mcols = c; render(true); document.getElementById('mcol-' + e.target.dataset.mcol)?.focus(); }
});
document.querySelectorAll('[data-version]').forEach(b => b.addEventListener('click', () => { S.version = b.dataset.version; store.set('ha-version', S.version); render(true); }));
window.addEventListener('hashchange', () => { render(false); window.scrollTo(0, 0); });
let wasDesk = matchMedia('(min-width: 1024px)').matches;
window.addEventListener('resize', () => { const d = matchMedia('(min-width: 1024px)').matches; if (d !== wasDesk) { wasDesk = d; render(true); } });
render(false);
</script>
